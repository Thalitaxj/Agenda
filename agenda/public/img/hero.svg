<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Agenda e agendamento pelo WhatsApp">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#128c7e"/>
      <stop offset="1" stop-color="#0b6b60"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f5f7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="660" cy="110" r="150" fill="#25d366" opacity="0.18"/>
  <circle cx="120" cy="520" r="120" fill="#25d366" opacity="0.14"/>

  <!-- celular -->
  <g filter="url(#sh)">
    <rect x="250" y="90" width="300" height="430" rx="34" fill="#111827"/>
    <rect x="266" y="118" width="268" height="374" rx="18" fill="url(#card)"/>
  </g>

  <!-- cabeçalho do app -->
  <circle cx="306" cy="162" r="18" fill="#128c7e"/>
  <rect x="334" y="150" width="120" height="12" rx="6" fill="#1a1f27"/>
  <rect x="334" y="170" width="80" height="9" rx="4.5" fill="#9aa3af"/>

  <!-- itens de agenda -->
  <g>
    <rect x="288" y="206" width="224" height="58" rx="12" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="300" y="222" width="42" height="26" rx="6" fill="#e3f8ec"/>
    <rect x="356" y="220" width="110" height="10" rx="5" fill="#1a1f27"/>
    <rect x="356" y="238" width="70" height="8" rx="4" fill="#9aa3af"/>
    <circle cx="492" cy="235" r="9" fill="#25d366"/>
  </g>
  <g>
    <rect x="288" y="276" width="224" height="58" rx="12" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="300" y="292" width="42" height="26" rx="6" fill="#fff4e0"/>
    <rect x="356" y="290" width="96" height="10" rx="5" fill="#1a1f27"/>
    <rect x="356" y="308" width="84" height="8" rx="4" fill="#9aa3af"/>
    <circle cx="492" cy="305" r="9" fill="#d9941f"/>
  </g>
  <g>
    <rect x="288" y="346" width="224" height="58" rx="12" fill="#ffffff" stroke="#e4e7eb"/>
    <rect x="300" y="362" width="42" height="26" rx="6" fill="#e8edf5"/>
    <rect x="356" y="360" width="104" height="10" rx="5" fill="#1a1f27"/>
    <rect x="356" y="378" width="60" height="8" rx="4" fill="#9aa3af"/>
    <circle cx="492" cy="375" r="9" fill="#3b82f6"/>
  </g>

  <!-- botão WhatsApp -->
  <rect x="288" y="424" width="224" height="46" rx="23" fill="#25d366"/>
  <path d="M374 447a14 14 0 1 0 -5 11l9 2-2-8a14 14 0 0 0 -2-5z" fill="#06331b" transform="translate(16 -8) scale(0.9)"/>
  <rect x="402" y="441" width="86" height="12" rx="6" fill="#06331b"/>

  <!-- balão de chat flutuante -->
  <g filter="url(#sh)">
    <rect x="96" y="150" width="150" height="86" rx="18" fill="#ffffff"/>
    <rect x="116" y="176" width="110" height="9" rx="4.5" fill="#1a1f27"/>
    <rect x="116" y="194" width="86" height="9" rx="4.5" fill="#9aa3af"/>
    <path d="M120 236 l0 22 l22 -22 z" fill="#ffffff"/>
  </g>
</svg>
